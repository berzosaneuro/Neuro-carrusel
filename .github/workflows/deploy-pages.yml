name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/english-learning-app-9fbgtw]
  workflow_dispatch:

# Pages serves this site from the gh-pages branch, so the build is published
# by pushing to that branch rather than through the Pages deployment API.
permissions:
  contents: write

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: client
        run: npm install
      - name: Build
        working-directory: client
        run: npm run build
      - name: Publish to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch client/dist/.nojekyll
          cd client/dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy $GITHUB_SHA"
          git push -f -q "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY.git" gh-pages
